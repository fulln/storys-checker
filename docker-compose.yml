# Storys Checker — 一键部署（推荐给第三方）
#
# 用法：
#   1) cp .env.example .env            并设置真实的 STORYS_CHECKER_PASSWORD
#   2) cp config.example.json config.json  改为要监控的项目（容器内路径以 /projects 开头）
#   3) docker compose up -d
#   4) 打开 http://127.0.0.1:8787
#
# 安全默认：只绑定本机回环地址、强制登录密码、只读模式（不能执行命令 / 写文件）。
# 需要开放给局域网时，把 ports 改成 "8787:8787" 并务必保留密码与 HTTPS 反代。
services:
  storys-checker:
    build: .
    image: storys-checker:2.0.0
    container_name: storys-checker
    restart: unless-stopped
    ports:
      # 只绑定回环：外部无法直连。要暴露请改 "8787:8787" 并配合反代 + HTTPS
      - "127.0.0.1:8787:8787"
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      # 可变状态落到 /state 卷，镜像本身保持只读
      STORYS_CHECKER_STATE_DIR: "/state"
      # 只读模式：面板可以扫描、检查、看健康分，但不能执行命令或改写被监控项目
      STORYS_CHECKER_READONLY: "1"
      # HTTP Basic Auth（浏览器原生弹窗，无需额外配置）
      STORYS_CHECKER_USER: "${STORYS_CHECKER_USER:-admin}"
      STORYS_CHECKER_PASSWORD: "${STORYS_CHECKER_PASSWORD:?请先创建 .env 并设置 STORYS_CHECKER_PASSWORD}"
    volumes:
      # 运行期状态（扫描结果、检查报告、历史、日志）
      - storys-checker-state:/state
      # 被监控项目的配置：只读挂载
      - ./config.json:/app/config.json:ro
      # 被监控项目代码：只读挂载。config.json 里请用 /projects/... 路径
      - "${PROJECTS_DIR:-./examples}:/projects:ro"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    # 加固
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  storys-checker-state:
